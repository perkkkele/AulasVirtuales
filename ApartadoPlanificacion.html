<style>
  .marquee-container {
    overflow: hidden;
    white-space: nowrap;
    box-sizing: border-box;
    background: #004b7f; /* o tu color de fondo */
    padding: 0.5em 0;
  }
  .marquee-text {
    display: inline-block;
    padding-left: 100%;
    /* Duración de la animación en segundos: ajusta a tu gusto */
    animation: marquee 20s linear infinite;
  }
  .marquee-container:hover .marquee-text {
    animation-play-state: paused; /* pausa al hacer hover */
  }
  @keyframes marquee {
    from   { transform: translateX(0%); }
    to     { transform: translateX(-100%); }
  }
</style>

<div class="marquee-container">
  <div class="marquee-text" style="color: #fff;">
